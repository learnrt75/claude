# Publishes the Kanban board to GitHub Pages on every push to main.
#
# One-time setup in the repo: Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Without that, this workflow fails at the deploy step.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows a manual run from the Actions tab

# Permissions the deploy-pages action requires.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is a single static index.html at the repo root, so the
      # whole root is uploaded as-is. There is nothing to build.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
